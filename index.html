<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spinning Cube</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
        }
        
        #glCanvas {
            display: block;
            width: 960px;
            height: 600px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <canvas id="glCanvas"></canvas>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
